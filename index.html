<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海口市2025年初中学业水平考试地理模拟试题一</title>
    <style>
        :root {
            --primary: #4A90D9;
            --success: #52c41a;
            --error: #ff4d4f;
            --warning: #faad14;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #333;
            --text-secondary: #666;
            --border: #e8e8e8;
            --shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        /* 顶部导航 */
        .header {
            background: linear-gradient(135deg, var(--primary), #6BB3F0);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        
        .progress-bar {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            height: 8px;
            margin-top: 15px;
            overflow: hidden;
        }
        
        .progress-fill {
            background: white;
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .progress-text {
            font-size: 0.9rem;
            margin-top: 8px;
        }
        
        /* 主容器 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        
        /* 试卷信息页 */
        .exam-info {
            text-align: center;
        }
        
        .exam-info h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }
        
        .exam-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .meta-item {
            background: var(--bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .meta-item .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }
        
        .meta-item .label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .start-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .start-btn:hover {
            background: #3A7BC8;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(74, 144, 217, 0.4);
        }
        
        /* 题目卡片 */
        .question-card {
            display: none;
        }
        
        .question-card.active {
            display: block;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .question-num {
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .question-score {
            color: var(--text-secondary);
        }
        
        .question-type {
            background: #E6F7FF;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-left: 10px;
        }
        
        .question-type.comprehensive {
            background: #FFF7E6;
            color: var(--warning);
        }
        
        .question-stem {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        
        /* 图片容器 - 智能匹配 */
        .image-container {
            margin: 20px 0;
            text-align: center;
        }
        
        .image-container img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        
        .image-caption {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 8px;
        }
        
        /* 选项样式 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            background: var(--bg);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .option:hover {
            border-color: var(--primary);
            background: #F0F7FF;
        }
        
        .option.selected {
            border-color: var(--primary);
            background: #E6F7FF;
        }
        
        .option.correct {
            border-color: var(--success);
            background: #F6FFED;
        }
        
        .option.wrong {
            border-color: var(--error);
            background: #FFF1F0;
        }
        
        .option-label {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        
        .option.selected .option-label {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        .option.correct .option-label {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }
        
        .option.wrong .option-label {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }
        
        .option-text {
            flex: 1;
        }
        
        /* 主观题输入框 */
        .subjective-input {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
        }
        
        .subjective-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* 隐藏答案区域 */
        .answer-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--border);
        }
        
        .answer-toggle {
            background: var(--warning);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .answer-toggle:hover {
            background: #E69900;
        }
        
        .answer-toggle::before {
            content: '👁';
        }
        
        .answer-content {
            display: none;
            margin-top: 15px;
            padding: 20px;
            background: #FFF9E6;
            border-radius: 10px;
            border-left: 4px solid var(--warning);
        }
        
        .answer-content.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .answer-label {
            font-weight: bold;
            color: var(--warning);
            margin-bottom: 10px;
        }
        
        .explanation {
            margin-top: 15px;
            padding: 15px;
            background: #F0F7FF;
            border-radius: 8px;
            color: var(--text-secondary);
        }
        
        .explanation-label {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
        }
        
        /* 按钮区域 */
        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-prev {
            background: var(--bg);
            color: var(--text);
        }
        
        .btn-prev:hover {
            background: #E8E8E8;
        }
        
        .btn-next {
            background: var(--primary);
            color: white;
        }
        
        .btn-next:hover {
            background: #3A7BC8;
        }
        
        .btn-submit {
            background: var(--success);
            color: white;
        }
        
        .btn-submit:hover {
            background: #3CAD1A;
        }
        
        /* 批改相关 */
        .grading-section {
            margin-top: 20px;
            padding: 20px;
            background: #F6FFED;
            border-radius: 10px;
            border: 2px solid var(--success);
            display: none;
        }
        
        .grading-section.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .grading-question {
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text);
        }
        
        .grading-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .grading-btn {
            padding: 10px 25px;
            border: 2px solid var(--success);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }
        
        .grading-btn:hover {
            background: var(--success);
            color: white;
        }
        
        .grading-btn.selected-correct {
            background: var(--success);
            color: white;
        }
        
        .grading-btn.selected-wrong {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }
        
        /* 结果页 */
        .result-page {
            display: none;
        }
        
        .result-page.active {
            display: block;
        }
        
        .result-header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, var(--primary), #6BB3F0);
            color: white;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        
        .result-score {
            font-size: 4rem;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .result-label {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .stat-value.correct-stat {
            color: var(--success);
        }
        
        .stat-value.wrong-stat {
            color: var(--error);
        }
        
        .stat-value.total-stat {
            color: var(--primary);
        }
        
        .stat-label {
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        /* 错题总结 */
        .wrong-summary {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }
        
        .wrong-summary h3 {
            color: var(--error);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .wrong-item {
            padding: 15px;
            background: #FFF1F0;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--error);
        }
        
        .wrong-item:last-child {
            margin-bottom: 0;
        }
        
        .wrong-q-num {
            font-weight: bold;
            color: var(--error);
            margin-bottom: 8px;
        }
        
        .wrong-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
        }
        
        .your-answer {
            color: var(--error);
        }
        
        .correct-answer {
            color: var(--success);
        }
        
        /* 提升建议 */
        .suggestions {
            background: linear-gradient(135deg, #E6F7FF, #BAE7FF);
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow);
        }
        
        .suggestions h3 {
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .suggestion-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
        
        .suggestion-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        
        .suggestion-text {
            flex: 1;
        }
        
        .suggestion-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text);
        }
        
        .suggestion-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        /* 知识点标签 */
        .knowledge-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .tag {
            background: #E6F7FF;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity:1; transform: translateY(0); }
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .card {
                padding: 18px;
            }
            
            .result-stats {
                grid-template-columns: 1fr;
            }
            
            .wrong-detail {
                grid-template-columns: 1fr;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--bg);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 完成提示 */
        .completion-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--success);
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header" id="header" style="display: none;">
        <h1 id="headerTitle">海口市2025年地理模拟考试</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">已作答 0/38 题</div>
    </div>
    
    <div class="container">
        <!-- 试卷信息页 -->
        <div class="card exam-info" id="startPage">
            <h2>📝 海口市2025年初中学业水平考试</h2>
            <h3 style="color: var(--primary); margin: 10px 0;">地理模拟试题一</h3>
            
            <div class="exam-meta">
                <div class="meta-item">
                    <div class="value">38</div>
                    <div class="label">题目数量</div>
                </div>
                <div class="meta-item">
                    <div class="value">100</div>
                    <div class="label">总分</div>
                </div>
                <div class="meta-item">
                    <div class="value">选择题</div>
                    <div class="label">题型说明</div>
                </div>
                <div class="meta-item">
                    <div class="value">60分钟</div>
                    <div class="label">建议时长</div>
                </div>
            </div>
            
            <div style="text-align: left; margin: 20px 0; padding: 20px; background: #F0F7FF; border-radius: 10px;">
                <h4 style="color: var(--primary); margin-bottom: 10px;">📋 答题说明</h4>
                <ul style="color: var(--text-secondary); line-height: 2;">
                    <li>选择题直接在选项上点击作答</li>
                    <li>综合题请在下方文本框中输入答案</li>
                    <li>每道题作答后可点击"查看答案"核对</li>
                    <li>答题结束后自动批改并生成详细报告</li>
                </ul>
            </div>
            
            <button class="start-btn" id="startBtn" onclick="startExam()">🚀 开始答题</button>
        </div>
        
        <!-- 题目区域 -->
        <div id="questionArea" style="display: none;"></div>
        
        <!-- 结果页 -->
        <div class="result-page" id="resultPage">
            <div class="result-header">
                <div class="result-label">您的得分</div>
                <div class="result-score"><span id="finalScore">0</span>分</div>
                <div class="completion-badge">🎉 答题完成</div>
            </div>
            
            <div class="result-stats">
                <div class="stat-card">
                    <div class="stat-value correct-stat" id="correctCount">0</div>
                    <div class="stat-label">答对</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value wrong-stat" id="wrongCount">0</div>
                    <div class="stat-label">答错</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value total-stat" id="totalCount">38</div>
                    <div class="stat-label">总题数</div>
                </div>
            </div>
            
            <div class="wrong-summary" id="wrongSummary">
                <h3>❌ 错题总结</h3>
                <div id="wrongList"></div>
            </div>
            
            <div class="suggestions" id="suggestions">
                <h3>💡 提升建议</h3>
                <div id="suggestionList"></div>
            </div>
            
            <div class="btn-group" style="margin-top: 25px;">
                <button class="btn btn-prev" onclick="reviewAnswers()">📖 回顾答案</button>
                <button class="btn btn-submit" onclick="restartExam()">🔄 重新答题</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
